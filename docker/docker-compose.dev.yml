name: lms-dev

services:
  db:
    container_name: lms-db
    image: postgres:17.6
    env_file:
      - ../packages/db/.env.db.dev
    ports:
      - 5432:5432
    volumes:
      # PostgreSQLのデータを永続化
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ローカル環境用のGCSエミュレーター
  fake-gcs:
    container_name: lms-fake-gcs
    image: fsouza/fake-gcs-server:1.56
    ports:
      - 4443:4443
      - 8000:8000
    volumes:
      - gcs_data:/data
    command: ["-scheme", "both", "-backend", "memory"]

  # GCSバケット作成
  gcs-init:
    container_name: lms-gcs-init
    image: curlimages/curl:8.22.0
    depends_on:
      fake-gcs:
        condition: service_started
    command: >
      sh -c "curl -X PUT http://fake-gcs:8000/dummy-storage-bucket && echo 'Bucket created successfully'"

volumes:
  postgres_data:
  gcs_data:

networks:
  default:
    name: lms-dev-network
