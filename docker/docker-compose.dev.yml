name: lms-dev

services:
  server:
    container_name: lms-server
    build:
      # ビルド対象をルートディレクトリ（docker-compose.ymlのあるディレクトリから見た場合../）に設定
      context: ..
      # このブロックに限りカレントディレクトリはルートディレクトリを指す
      dockerfile: apps/server/Dockerfile.dev
    ports:
      # ポートマッピング（ホスト:コンテナ）
      - 3000:3000
    volumes:
      # ホストのルートディレクトリをコンテナにマウント
      - ..:/lms-repo
      # node_modulesをホストと分離してコンテナにマウント
      - node_modules:/lms-repo/node_modules
    depends_on:
      db:
        condition: service_healthy
      fake-gcs:
        condition: service_started

  web:
    container_name: lms-web
    build:
      # ビルド対象をルートディレクトリ（docker-compose.ymlのあるディレクトリから見た場合../）に設定
      context: ..
      # このブロックに限りカレントディレクトリはルートディレクトリを指す
      dockerfile: apps/web/Dockerfile.dev
    ports:
      # ポートマッピング（ホスト:コンテナ）
      - 3001:3001
    volumes:
      # ホストのルートディレクトリをコンテナにマウント
      - ..:/lms-repo
      # node_modulesをホストと分離してコンテナにマウント
      - node_modules:/lms-repo/node_modules
    depends_on:
      - server

  db:
    container_name: lms-db
    image: postgres:17.6
    env_file:
      - ../packages/db/.env.db.dev
    ports:
      - 5432:5432
    volumes:
      # PostgreSQLのデータを永続化
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ローカル環境用のGCSエミュレーター
  fake-gcs:
    container_name: lms-fake-gcs
    image: fsouza/fake-gcs-server
    ports:
      - 4443:4443
      - 8000:8000
    volumes:
      - gcs_data:/data
    command: ["-scheme", "both", "-backend", "memory"]

  # GCSバケット作成
  gcs-init:
    container_name: lms-gcs-init
    image: curlimages/curl:8.22.0
    depends_on:
      fake-gcs:
        condition: service_started
    command: >
      sh -c "curl -X PUT http://fake-gcs:8000/dummy-storage-bucket && echo 'Bucket created successfully'"

volumes:
  node_modules:
  postgres_data:
  gcs_data:

networks:
  default:
    name: lms-dev-network

